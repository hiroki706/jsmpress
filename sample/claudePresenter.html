<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter View</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #0f0f13;
      --surface: #17171f;
      --surface2: #1e1e2a;
      --surface3: #252535;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #6c8ef0;
      --accent2: #e0885a;
      --text: #e8e8f0;
      --text-dim: #8888a8;
      --text-muted: #555568;
      --green: #5ecf8a;
      --red: #e07070;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans JP', sans-serif;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 100;
    }

    #topbar h1 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #topbar .spacer {
      flex: 1;
    }

    .btn {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface3);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    .btn.primary:hover {
      filter: brightness(1.12);
    }

    #file-label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px dashed rgba(108, 142, 240, 0.4);
      background: rgba(108, 142, 240, 0.06);
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }

    #file-label:hover {
      border-color: var(--accent);
      background: rgba(108, 142, 240, 0.12);
    }

    #file-input {
      display: none;
    }

    /* ── MAIN LAYOUT ── */
    #app {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
    }

    /* ── PANELS ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 14px 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .panel-body {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Current slide – big, spanning both rows */
    #current-panel {
      grid-row: 1 / 3;
      grid-column: 1;
    }

    /* Sidebar panels */
    #next-panel {
      grid-row: 1;
      grid-column: 2;
    }

    #notes-panel {
      grid-row: 2;
      grid-column: 2;
    }

    /* ── CANVAS ── */
    .slide-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    #current-canvas {
      max-width: calc(100% - 24px);
      max-height: calc(100% - 24px);
    }

    #next-canvas {
      max-width: calc(100% - 16px);
      max-height: calc(100% - 16px);
    }

    /* ── NOTES ── */
    #notes-body {
      padding: 14px 16px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: flex-start;
    }

    #notes-text {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
      width: 100%;
    }

    #notes-text em {
      color: var(--accent2);
      font-style: normal;
      font-weight: 600;
    }

    /* ── BOTTOM BAR ── */
    #bottombar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      align-items: center;
      padding: 10px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      gap: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .stat-value.accent {
      color: var(--accent);
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.red {
      color: var(--red);
    }

    #nav-area {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      user-select: none;
    }

    .nav-btn:hover {
      background: var(--surface3);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── EMPTY STATE ── */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #empty-state svg {
      opacity: 0.3;
    }

    #empty-state p {
      font-size: 13px;
    }

    /* ── TIMER CONTROLS ── */
    #timer-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .timer-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .timer-btn:hover {
      background: var(--surface3);
    }

    .timer-btn.active {
      color: var(--green);
      border-color: var(--green);
    }

    .timer-btn.reset-btn:hover {
      color: var(--red);
      border-color: var(--red);
    }

    /* ── SLIDE COUNTER DOTS ── */
    #slide-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 160px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.4);
    }

    .dot.done {
      background: var(--text-dim);
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 19, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
      backdrop-filter: blur(4px);
      display: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading p {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ── AUDIENCE WINDOW INDICATOR ── */
    #audience-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 3px;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <!-- Loading overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-text">PDFを読み込んでいます…</p>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <h1>🎤 Presenter View</h1>
    <label id="file-label" for="file-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
      PDFを開く
    </label>
    <input type="file" id="file-input" accept=".pdf">
    <div class="spacer"></div>
    <div id="audience-status">
      <div class="status-dot" id="audience-dot"></div>
      <span id="audience-label">共有画面 未接続</span>
    </div>
    <button class="btn primary" id="open-audience-btn" onclick="openAudienceWindow()">📺 共有画面を開く</button>
  </div>

  <!-- Main area -->
  <div id="app">
    <!-- Current slide (big) -->
    <div class="panel" id="current-panel">
      <div class="panel-label">現在のスライド</div>
      <div class="panel-body" id="current-body">
        <div id="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
          <p>PDFファイルを開いてください</p>
        </div>
        <canvas id="current-canvas" class="slide-canvas"></canvas>
      </div>
    </div>

    <!-- Next slide -->
    <div class="panel" id="next-panel">
      <div class="panel-label">次のスライド</div>
      <div class="panel-body">
        <canvas id="next-canvas" class="slide-canvas"></canvas>
      </div>
    </div>

    <!-- Speaker notes -->
    <div class="panel" id="notes-panel">
      <div class="panel-label">スピーカーノート</div>
      <div class="panel-body" id="notes-body">
        <div id="notes-text"></div>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div id="bottombar">
    <div class="stat-item">
      <div class="stat-label">スライド番号</div>
      <div class="stat-value accent" id="slide-num">—</div>
    </div>

    <div class="stat-item">
      <div class="stat-label">経過時間</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="stat-value green" id="elapsed-time">00:00</div>
        <div id="timer-controls">
          <button class="timer-btn" id="timer-toggle-btn" onclick="toggleTimer()" title="開始/停止">▶</button>
          <button class="timer-btn reset-btn" onclick="resetTimer()" title="リセット">↺</button>
        </div>
      </div>
    </div>

    <div class="stat-item">
      <div class="stat-label">スライド進捗</div>
      <div id="slide-indicator"></div>
    </div>

    <div id="nav-area">
      <button class="nav-btn" id="prev-btn" onclick="prevSlide()" disabled>◀</button>
      <button class="nav-btn" id="next-btn" onclick="nextSlide()" disabled>▶</button>
    </div>
  </div>

  <script>
    // ── PDF.js setup ──
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ── State ──
    let pdfDoc = null;
    let totalSlides = 0;
    let currentSlide = 1;
    let audienceWindow = null;
    let timerInterval = null;
    let timerRunning = false;
    let timerSeconds = 0;
    let slideTexts = []; // extracted text per slide

    // ── File input ──
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const arrayBuffer = await file.arrayBuffer();
      await loadPDF(arrayBuffer);
    });

    async function loadPDF(arrayBuffer) {
      showLoading('PDFを読み込んでいます…');
      try {
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        // PDF has N pages: each page = 1 slide (top half) + notes (bottom half)
        totalSlides = pdfDoc.numPages;

        // Pre-extract text from all pages for notes
        slideTexts = [];
        for (let i = 1; i <= totalSlides; i++) {
          updateLoading(`テキストを抽出中 ${i}/${totalSlides}`);
          const page = await pdfDoc.getPage(i);
          const textContent = await page.getTextContent();
          slideTexts.push(textContent.items.map(item => item.str).join(' '));
        }

        buildDots();
        document.getElementById('empty-state').style.display = 'none';
        currentSlide = 1;
        await renderAll();
        updateNav();
        hideLoading();
      } catch (err) {
        hideLoading();
        alert('PDFの読み込みに失敗しました: ' + err.message);
      }
    }

    // ── Render ──
    async function renderAll() {
      await renderSlideToCanvas(currentSlide, 'current-canvas', 'slide');
      if (currentSlide < totalSlides) {
        await renderSlideToCanvas(currentSlide + 1, 'next-canvas', 'slide');
      } else {
        clearCanvas('next-canvas');
      }
      showNotes(currentSlide);
      updateDots();
      updateSlideNum();
      syncAudienceWindow();
    }

    // Render the SLIDE portion (top 50%) of a page to a canvas element
    async function renderSlideToCanvas(pageNum, canvasId, portion) {
      if (!pdfDoc) return;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1 });

      // The PDF page is slide (top 50%) + notes (bottom 50%)
      // For slides we render only the top half
      const slideH = viewport.height / 2;
      const slideW = viewport.width;

      // Determine container size
      const container = canvas.parentElement;
      const maxW = container.clientWidth - 24;
      const maxH = container.clientHeight - 24;
      const scale = Math.min(maxW / slideW, maxH / slideH);

      const scaledW = slideW * scale;
      const scaledH = slideH * scale;

      canvas.width = scaledW;
      canvas.height = scaledH;

      // Clip to top half
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, scaledW, scaledH);
      ctx.clip();

      await page.render({
        canvasContext: ctx,
        viewport: page.getViewport({ scale }),
      }).promise;

      ctx.restore();
    }

    // Render NOTES portion (bottom 50%) — returns image data URL
    async function renderNotesPortion(pageNum, targetCanvas) {
      if (!pdfDoc) return null;
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1 });

      const pageH = viewport.height;
      const slideH = pageH / 2;
      const slideW = viewport.width;

      // Render full page at 1x
      const offscreen = document.createElement('canvas');
      offscreen.width = slideW;
      offscreen.height = pageH;
      const offCtx = offscreen.getContext('2d');
      await page.render({ canvasContext: offCtx, viewport: page.getViewport({ scale: 1 }) }).promise;

      // Crop bottom half
      const notesCanvas = document.createElement('canvas');
      notesCanvas.width = slideW;
      notesCanvas.height = slideH;
      const notesCtx = notesCanvas.getContext('2d');
      notesCtx.drawImage(offscreen, 0, slideH, slideW, slideH, 0, 0, slideW, slideH);

      return notesCanvas.toDataURL();
    }

    function clearCanvas(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    async function extractNotes(pageNum) {
    }

    async function showNotes(pageNum) {
      const text = await extractNotes(pageNum);
      const el = document.getElementById('notes-text');
      if (!text) {
        el.textContent = 'このスライドにノートはありません。';
        el.style.color = 'var(--text-muted)';
      } else {
        el.style.color = 'var(--text)';
        el.textContent = text;
      }
    }

    // ── Navigation ──
    async function prevSlide() {
      if (currentSlide <= 1) return;
      currentSlide--;
      await renderAll();
      updateNav();
    }

    async function nextSlide() {
      if (currentSlide >= totalSlides) return;
      currentSlide++;
      await renderAll();
      updateNav();
    }

    function updateNav() {
      document.getElementById('prev-btn').disabled = currentSlide <= 1;
      document.getElementById('next-btn').disabled = currentSlide >= totalSlides;
    }

    function updateSlideNum() {
      document.getElementById('slide-num').textContent =
        totalSlides > 0 ? `${currentSlide} / ${totalSlides}` : '—';
    }

    // ── Slide indicator dots ──
    function buildDots() {
      const container = document.getElementById('slide-indicator');
      container.innerHTML = '';
      for (let i = 1; i <= totalSlides; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.dataset.slide = i;
        dot.title = `スライド ${i}`;
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', async () => {
          currentSlide = i;
          await renderAll();
          updateNav();
        });
        container.appendChild(dot);
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll('#slide-indicator .dot');
      dots.forEach((dot, idx) => {
        const n = idx + 1;
        dot.classList.remove('active', 'done');
        if (n === currentSlide) dot.classList.add('active');
        else if (n < currentSlide) dot.classList.add('done');
      });
    }

    // ── Timer ──
    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.textContent = '▶';
        btn.classList.remove('active');
      } else {
        timerRunning = true;
        btn.textContent = '⏸';
        btn.classList.add('active');
        timerInterval = setInterval(() => {
          timerSeconds++;
          updateTimerDisplay();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 0;
      updateTimerDisplay();
      const btn = document.getElementById('timer-toggle-btn');
      btn.textContent = '▶';
      btn.classList.remove('active');
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('elapsed-time').textContent = `${m}:${s}`;
    }

    // ── Audience (screen share) window ──
    function openAudienceWindow() {
      if (audienceWindow && !audienceWindow.closed) {
        audienceWindow.focus();
        return;
      }
      audienceWindow = window.open('', 'audience', 'width=1280,height=720');
      if (!audienceWindow) {
        alert('ポップアップがブロックされました。ブラウザの設定で許可してください。');
        return;
      }
      writeAudienceHTML();
      syncAudienceWindow();
      updateAudienceStatus(true);

      // Detect if audience window is closed
      const checkClosed = setInterval(() => {
        if (audienceWindow && audienceWindow.closed) {
          clearInterval(checkClosed);
          audienceWindow = null;
          updateAudienceStatus(false);
        }
      }, 1000);
    }

    function writeAudienceHTML() {
      audienceWindow.document.open();
      audienceWindow.document.write(`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Slide Display</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    #msg {
      color: #444;
      font-family: sans-serif;
      font-size: 16px;
      position: absolute;
    }
  </style>
  </head>

  <body>
    <div id="msg">スライドを待機中…</div>
    <canvas id="slide"></canvas>
  </body>

</html>`);
      audienceWindow.document.close();
    }

    async function syncAudienceWindow() {
      if (!audienceWindow || audienceWindow.closed || !pdfDoc) return;

      try {
        const canvas = audienceWindow.document.getElementById('slide');
        if (!canvas) return;

        const page = await pdfDoc.getPage(currentSlide);
        const viewport = page.getViewport({ scale: 1 });
        const slideH = viewport.height / 2;
        const slideW = viewport.width;

        const winW = audienceWindow.innerWidth;
        const winH = audienceWindow.innerHeight;
        const scale = Math.min(winW / slideW, winH / slideH);

        canvas.width = slideW * scale;
        canvas.height = slideH * scale;

        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, canvas.height);
        ctx.clip();

        await page.render({
          canvasContext: ctx,
          viewport: page.getViewport({ scale }),
        }).promise;
        ctx.restore();

        // Hide message
        const msg = audienceWindow.document.getElementById('msg');
        if (msg) msg.style.display = 'none';
      } catch (_) {
        // Window may have been closed mid-render
      }
    }

    function updateAudienceStatus(connected) {
      const dot = document.getElementById('audience-dot');
      const label = document.getElementById('audience-label');
      if (connected) {
        dot.classList.add('connected');
        label.textContent = '共有画面 接続中';
      } else {
        dot.classList.remove('connected');
        label.textContent = '共有画面 未接続';
      }
    }

    // ── Loading helpers ──
    function showLoading(text) {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading-text').textContent = text;
    }
    function updateLoading(text) {
      document.getElementById('loading-text').textContent = text;
    }
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // ── Keyboard navigation ──
    document.addEventListener('keydown', (e) => {
      if (!pdfDoc) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        prevSlide();
      }
    });

    // ── Drag & drop ──
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', async (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (!file || !file.name.endsWith('.pdf')) return;
      const arrayBuffer = await file.arrayBuffer();
      await loadPDF(arrayBuffer);
    });

    // ── Re-render on resize ──
    window.addEventListener('resize', async () => {
      if (pdfDoc) await renderAll();
    });
  </script>
</body>

</html>
